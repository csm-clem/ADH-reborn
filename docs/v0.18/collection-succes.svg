<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="810" viewBox="0 0 1050 810">
<rect width="1050" height="810" fill="#f7f9fc"/><g font-family="Arial,sans-serif" fill="#34445f">
<text x="52" y="62" font-size="13" letter-spacing="2">MAQUETTE DE PRINCIPE · DONNÉES FICTIVES</text><text x="52" y="112" font-size="38" font-weight="700">Votre collection, à écouter.</text><text x="52" y="145" font-size="17" fill="#647187">Des phrases gagnées, des repères à retrouver et vos prochains défis.</text>
<rect x="52" y="180" width="112" height="44" rx="22" fill="#e9edf3"/><text x="108" y="208" font-size="15" text-anchor="middle">Repères</text><rect x="176" y="180" width="112" height="44" rx="22" fill="#e9edf3"/><text x="232" y="208" font-size="15" text-anchor="middle">Fluidité</text><rect x="300" y="180" width="130" height="44" rx="22" fill="#34445f"/><text x="365" y="208" font-size="15" text-anchor="middle" fill="#fff">Musiques</text>
<text x="52" y="270" font-size="22" font-weight="700">2 phrases sur 4</text><text x="700" y="270" font-size="15" fill="#b64024">Tous</text><text x="758" y="270" font-size="15">Obtenus</text><text x="850" y="270" font-size="15">À découvrir</text>
<g><rect x="52" y="302" width="294" height="326" rx="18" fill="#fff" stroke="#d7dee7"/><rect x="70" y="320" width="258" height="133" rx="10" fill="#f6d59c"/><text x="199" y="400" text-anchor="middle" font-size="43">♫</text><text x="72" y="484" font-size="18" font-weight="700">Frère Jacques</text><text x="72" y="512" font-size="14" fill="#21653b">✓ Phrase obtenue</text><text x="72" y="538" font-size="13" fill="#647187">Une chaîne jouée sans erreur.</text><rect x="72" y="560" width="122" height="44" rx="22" fill="#b64024"/><text x="133" y="588" text-anchor="middle" font-size="15" fill="#fff">▶ Écouter</text><text x="218" y="588" font-size="14">Rejouer</text></g>
<g><rect x="368" y="302" width="294" height="326" rx="18" fill="#fff" stroke="#d7dee7"/><rect x="386" y="320" width="258" height="133" rx="10" fill="#dce5d7"/><text x="515" y="400" text-anchor="middle" font-size="43">♫</text><text x="388" y="484" font-size="18" font-weight="700">Ah ! vous dirai-je, maman</text><text x="388" y="512" font-size="14" fill="#21653b">✓ Phrase obtenue</text><text x="388" y="538" font-size="13" fill="#647187">Votre première pochette.</text><rect x="388" y="560" width="122" height="44" rx="22" fill="#b64024"/><text x="449" y="588" text-anchor="middle" font-size="15" fill="#fff">▶ Écouter</text><text x="534" y="588" font-size="14">Rejouer</text></g>
<g><rect x="684" y="302" width="314" height="326" rx="18" fill="#fff" stroke="#b9c5d3"/><rect x="702" y="320" width="278" height="133" rx="10" fill="#edf1f6"/><text x="841" y="400" text-anchor="middle" font-size="43" fill="#748298">♫</text><text x="704" y="484" font-size="18" font-weight="700">Over the Rainbow</text><text x="704" y="512" font-size="14">À découvrir</text><text x="704" y="538" font-size="13" fill="#647187">Jouez l’extrait d’un seul trait.</text><rect x="704" y="560" width="150" height="44" rx="22" fill="#34445f"/><text x="779" y="588" text-anchor="middle" font-size="15" fill="#fff">Essayer le défi →</text></g>
<rect x="52" y="660" width="946" height="100" rx="16" fill="#fff" stroke="#d7dee7"/><text x="74" y="694" font-size="17" font-weight="700">Une collection utile, sans course imposée.</text><text x="74" y="723" font-size="15" fill="#647187">Chaque critère est visible. Aucun exercice n’est bloqué. Chaque pochette raconte une réussite musicale.</text><text x="74" y="745" font-size="13" fill="#647187">Mode liste disponible pour les grands caractères · symboles et libellés indépendants des couleurs.</text>
</g></svg>
