name: Vérification DFT
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: dft-verification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  source-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run check
      - run: npm test
      - run: npm run verify:release
  beta-and-production:
    needs: source-checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright==1.56.0
      - run: playwright install --with-deps chromium
      - name: Exécutable commun aux recettes existantes
        run: sudo ln -sf "$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')" /usr/bin/chromium
      - run: npm run release
      - name: Parcours et hors ligne
        run: |
          npm start > /tmp/dft-server.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://localhost:4173/ && break || sleep 1; done
          ADH_QA_OUTPUT=work/ci python tools/qa/beta-browser.py
          ADH_QA_OUTPUT=work/ci python tools/qa/technical-v030.py
          node tools/qa/roadmap-foundations.mjs
          python tools/qa/full-curriculum.py
          python tools/qa/update-current.py
          ADH_BASE_URL=http://localhost:4173/dist/ ADH_QA_OUTPUT=work/ci python tools/qa/beta-offline.py
      - run: npm run release:production
      - run: python tools/qa/production-smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dft-verification
          path: |
            downloads/*.zip
            downloads/*.json
            work/ci
            work/roadmap
            /tmp/dft-server.log
