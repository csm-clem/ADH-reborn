name: Déployer un essai DFT dans le bac à sable
on:
  push:
    branches: [sandbox/dft]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dft-o2switch
  cancel-in-progress: false
jobs:
  sandbox:
    if: github.repository == 'csm-clem/ADH-reborn'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Vérifier et préparer le candidat
        run: |
          python3 tests/environments_test.py
          npm run release
      - name: Construire un essai indépendant et déterministe
        env:
          SANDBOX_NUMBER: ${{ github.run_number }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          mkdir -p work
          python tools/environments.py sandbox --number "$SANDBOX_NUMBER" --commit "$SOURCE_COMMIT" > work/sandbox-build.json
          node tools/verify-release.mjs --sandbox
          python -c 'import json,os; p=json.load(open("work/sandbox-build.json")); open(os.environ["GITHUB_ENV"],"a").write("DFT_ARCHIVE="+p["archive"]+"\nDFT_BUILD="+p["build_id"]+"\nDFT_LIVE_BEFORE="+json.load(open(p["metadata"]))["base_live_version"]+"\n")'
      - name: Préparer la recette navigateur
        run: |
          pip install playwright==1.56.0
          playwright install --with-deps chromium
          sudo ln -sf "$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')" /usr/bin/chromium
      - name: Vérifier les données, le journal et le mode hors ligne
        run: |
          npm start > /tmp/dft-server.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://localhost:4173/ && break || sleep 1; done
          python tools/qa/sandbox.py
          python tools/qa/sandbox-update.py
      - name: Publier la copie de l’essai puis le bac à sable courant
        env:
          DFT_FTP_HOST: ${{ secrets.DFT_FTP_HOST }}
          DFT_FTP_USERNAME: ${{ secrets.DFT_FTP_USERNAME }}
          DFT_FTP_PASSWORD: ${{ secrets.DFT_FTP_PASSWORD }}
        run: python tools/deploy/ftps.py --channel sandbox --archive "$DFT_ARCHIVE"
      - name: Vérifier les deux copies et le live inchangé
        run: |
          python - <<'PY'
          import urllib.request,json,os
          base='https://media.lecompositeur.com/DFT/'
          def get(p):return json.load(urllib.request.urlopen(urllib.request.Request(base+p,headers={'Cache-Control':'no-cache'}),timeout=45))
          for path in ['lab/','lab/builds/'+os.environ['DFT_BUILD']+'/']:
              assert get(path+'build.json')['build_id']==os.environ['DFT_BUILD']
              assert get(path+'update.json')['channel']=='sandbox'
          assert get('update.json')['version']==os.environ['DFT_LIVE_BEFORE']
          print('Bac à sable, essai archivé et version live inchangée vérifiés.')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dft-sandbox
          path: |
            downloads/sandbox
            work/sandbox-build.json
            work/sandbox
