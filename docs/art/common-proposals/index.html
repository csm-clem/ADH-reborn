<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>DFT — Propositions communes</title><style>body{background:#e6ddce;color:#17313b;font:16px system-ui;margin:32px}h1{font-size:28px}main{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:24px}figure{margin:0;background:#f7edda;padding:12px;border-radius:14px}img{width:100%;display:block}figcaption{padding:16px 4px;line-height:1.5}strong{display:block}</style><h1>Commune, mais pas ordinaire.</h1><p>Propositions SVG — gravures musicales, cuivre mat et encre pétrole. Les contrôles des cartes restent inchangés.</p><main><figure><img src="first-session.svg" alt="La première fait le jack"><figcaption><strong>La première fait le jack</strong>Un objet sculptural, un premier signal solaire et un câble qui guide le regard.</figcaption></figure><figure><img src="opens-named.svg" alt="Enchanté, moi c’est…"><figcaption><strong>Enchanté, moi c’est…</strong>Six mécanismes et leurs signatures sonores : l’accordage devient une collection de voix.</figcaption></figure><figure><img src="diagram-check.svg" alt="Le manche a un sens"><figcaption><strong>Le manche a un sens</strong>Une carte architecturale avec boussole : comprendre l’instrument comme un territoire.</figcaption></figure><figure><img src="first-discovery.svg" alt="Il y a du monde sous les doigts"><figcaption><strong>Il y a du monde sous les doigts</strong>Un herbier de positions lumineuses : découvrir les notes, faire pousser ses repères.</figcaption></figure><figure><img src="first-chain.svg" alt="Le fil du riff"><figcaption><strong>Le fil du riff</strong>Un seul fil traverse la forme d’onde et rejoint le vinyle : continuité du geste et du phrasé.</figcaption></figure></main></html>
