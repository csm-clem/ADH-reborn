name: Publier un essai DFT en live
on:
  workflow_dispatch:
    inputs:
      sandbox_build:
        description: Identifiant exact de l’essai validé
        required: true
        type: string
      version:
        description: Version live, par exemple 0.38
        required: true
        type: string
      title:
        description: Titre de la publication
        required: true
        type: string
      confirmation:
        description: PUBLIER suivi de l’identifiant exact de l’essai
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: dft-o2switch
  cancel-in-progress: false
jobs:
  promote:
    if: github.repository == 'csm-clem/ADH-reborn'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Préparer la copie exacte de l’essai approuvé
        env:
          DFT_BUILD: ${{ inputs.sandbox_build }}
          DFT_VERSION: ${{ inputs.version }}
          DFT_TITLE: ${{ inputs.title }}
          DFT_CONFIRM: ${{ inputs.confirmation }}
        run: |
          mkdir -p work
          python tools/environments.py promote --build "$DFT_BUILD" --version "$DFT_VERSION" --title "$DFT_TITLE" --confirmation "$DFT_CONFIRM" --output downloads/promoted > work/promotion.json
          python -c 'import json,os; p=json.load(open("work/promotion.json")); open(os.environ["GITHUB_ENV"],"a").write("DFT_ARCHIVE="+p["archive"]+"\n")'
      - name: Publier uniquement la promotion confirmée
        env:
          DFT_FTP_HOST: ${{ secrets.DFT_FTP_HOST }}
          DFT_FTP_USERNAME: ${{ secrets.DFT_FTP_USERNAME }}
          DFT_FTP_PASSWORD: ${{ secrets.DFT_FTP_PASSWORD }}
          DFT_CONFIRM_PROMOTION: ${{ inputs.confirmation }}
        run: python tools/deploy/ftps.py --channel live --archive "$DFT_ARCHIVE"
      - name: Vérifier le live et son journal
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
          EXPECTED_BUILD: ${{ inputs.sandbox_build }}
        run: |
          python - <<'PY'
          import json,os,urllib.request
          from tools.environments import normalize_release
          def get(p):return json.load(urllib.request.urlopen('https://media.lecompositeur.com/DFT/'+p,timeout=45))
          assert get('update.json')['version']==normalize_release(os.environ['EXPECTED_VERSION'])
          assert get('release-ledger.json')['live_version']==normalize_release(os.environ['EXPECTED_VERSION'])
          assert get('promotion-receipt.json')['promoted_from']==os.environ['EXPECTED_BUILD']
          print('Version, journal live et origine de la promotion vérifiés.')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dft-live-promotion
          path: |
            downloads/promoted
            work/promotion.json
