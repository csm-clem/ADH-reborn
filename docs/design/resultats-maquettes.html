<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DFT — maquettes fonctionnelles des résultats</title>
<link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../../components.css"><link rel="stylesheet" href="../../result.css">
<style>body{font:16px system-ui;margin:auto;padding:24px;max-width:1000px;background:#f5f3ee;color:#19202a}form{display:flex;gap:20px;flex-wrap:wrap;margin:24px 0}label{display:grid;gap:8px}button{cursor:pointer}dialog{max-width:600px;border-radius:20px;padding:24px}.result-card{background:white;padding:24px;border-radius:24px}.examples{display:flex;gap:8px;flex-wrap:wrap}#detail{padding:20px}.stars{color:#bc7000}</style>
<h1>Résultats — laboratoire fonctionnel</h1><p>Données synthétiques. Le calcul des étoiles et le bilan utilisent les modules du jeu. Aucun progrès n’est enregistré.</p>
<div class="examples"><button data-preset="0,800">Sans faute rapide</button><button data-preset="0,2800">Sans faute lent</button><button data-preset="4,1500">Avec erreurs</button></div>
<form><label>Erreurs sur 24<input id="errors" type="number" min="0" max="24" value="0"></label><label>Temps moyen demandé (ms)<input id="time" type="number" min="300" max="10000" step="100" value="800"></label><label><span>Une réponse aidée</span><input id="aided" type="checkbox"></label></form><div id="result"></div><section id="detail" hidden></section><dialog><h2>Comprendre les étoiles</h2><div id="help"></div><button id="close">Fermer</button></dialog>
<script type="module">
import {score,makeProfile} from '../../core.js';
import {ratingAdvice,RATING_HELP} from '../../rating.js';
import {masteryView} from '../../mastery.js';
import {resultFrame} from '../../result-frame.js';
const profile=makeProfile('guitar6'),out=document.querySelector('#result'),detail=document.querySelector('#detail');
function render(){const errors=Math.max(0,Math.min(24,+document.querySelector('#errors').value)),ms=Math.max(300,+document.querySelector('#time').value),events=Array.from({length:24},(_,i)=>({target:{string:0,fret:[0,1,3][i%3],midi:[40,41,43][i%3]},correct:i>=errors,ms:ms+(i%3-1)*100,aids:document.querySelector('#aided').checked&&i===0?['listen']:[],mode:'name'})),r=score(events);detail.hidden=true;out.innerHTML=resultFrame({classes:'result-card',header:'<h2>Nommer les notes · exemple</h2>',summary:`<p>${r.correct}/24 bonnes réponses</p><button class="stars" id="stars" aria-label="Comprendre les étoiles">${'★'.repeat(r.stars)}${'☆'.repeat(5-r.stars)}<sup class="info-circle">i</sup></button><p>${ratingAdvice(events)}</p><p>Précision : ${Math.round(r.accuracy*100)} % · Moyenne : ${r.meanMs===null?'—':(r.meanMs/1000).toFixed(2)+' s'}</p>`,actions:`<button id="details">${errors?'Comprendre mes erreurs':'Mon bilan de maîtrise'}</button>`,details:''});out.querySelector('#stars').onclick=()=>document.querySelector('dialog').showModal();out.querySelector('#details').onclick=()=>{detail.hidden=!detail.hidden;detail.innerHTML=errors?`<h2>Mes ${errors} erreurs</h2><p>Le jeu réel affiche ici chaque réponse choisie et sa position attendue, puis propose la révision ciblée.</p>`:masteryView(events,profile,'international');};}
document.querySelector('#help').innerHTML=RATING_HELP;document.querySelector('#close').onclick=()=>document.querySelector('dialog').close();document.querySelector('form').oninput=render;document.querySelector('form').onsubmit=e=>e.preventDefault();for(const b of document.querySelectorAll('[data-preset]'))b.onclick=()=>{const [e,t]=b.dataset.preset.split(',');document.querySelector('#errors').value=e;document.querySelector('#time').value=t;document.querySelector('#aided').checked=false;render();};render();
</script></html>
